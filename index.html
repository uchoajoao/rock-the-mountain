.row{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; font:inherit; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:9px; padding:9px 11px; margin-bottom:6px; cursor:pointer; }
.row .n{ flex:1; font-weight:700; font-size:16px; }
.row .t{ font-size:14px; font-variant-numeric:tabular-nums; }
.box{ flex:none; width:24px; height:24px; border:2.5px solid var(--line); border-radius:50%; display:grid; place-items:center; font-size:14px; }
.row[aria-pressed="true"]{ background:var(--c); color:#17120A; border-color:#17120A; box-shadow:3px 3px 0 var(--shadow); }
.row[aria-pressed="true"] .box{ background:#17120A; color:#FFC61A; border-color:#17120A; }
.row[aria-pressed="true"] .box::after{ content:"✓"; }
.tl{ position:relative; padding-left:60px; }
.tl::before{ content:""; position:absolute; left:46px; top:6px; bottom:6px; width:3px; background:var(--line); border-radius:2px; }
.item{ position:relative; margin-bottom:10px; }
.time{ position:absolute; left:-60px; top:10px; width:40px; text-align:right; font-family:"Anton",Impact,sans-serif; font-size:19px; }
.dot{ position:absolute; left:-20px; top:15px; width:11px; height:11px; border-radius:50%; background:var(--bg); border:3px solid var(--line); }

.card .name{ font-family:"Anton",Impact,sans-serif; font-size:29px; line-height:1; }
.card .meta{ margin-top:5px; font-size:14px; font-weight:700; }
.gap{ margin:0 0 10px; font-size:13px; font-weight:700; opacity:.9; }
.gap.bad{ padding:6px 10px; border:2px dashed var(--red); border-radius:8px; opacity:1; }
.empty{ padding:22px 16px; border:2.5px dashed var(--line); border-radius:12px; font-size:15px; }
.actions{ display:flex; gap:8px; margin:0 0 20px; flex-wrap:wrap; }
.btn{ font:inherit; font-weight:700; font-size:14px; padding:9px 14px; color:var(--bg); background:var(--ink); border:2.5px solid var(--ink); border-radius:10px; cursor:pointer; }
.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.note{ font-size:12.5px; margin-top:24px; opacity:.85; }

.lg-sun{ fill:var(--pink); } .lg-mt{ fill:var(--blue); } .lg-snow{ fill:#fff; } .lg-bolt{ fill:var(--green); }
[hidden]{ display:none !important; }
</style>
</head>

  try{ navigator.clipboard.writeText(txt).then(function(){b.textContent="Copiado";setTimeout(function(){b.textContent="Copiar roteiro";},1600);},function(){b.textContent="Não foi possível copiar";}); }catch(e){ b.textContent="Não foi possível copiar"; }
};
$("pdf").onclick=async function(){
  var b=$("pdf"), lab="Baixar PDF";
  function msg(t){ b.textContent=t; setTimeout(function(){ b.textContent=lab; },2200); }
  var total=0; DAYS.forEach(function(D,di){ total+=chosen(di).length; });
  if(!total){ msg("Marque shows primeiro"); return; }
  try{
    var dl=window.claude&&await claude.use("downloads");
    if(!window.jspdf){ msg("PDF indisponível aqui"); return; }
    var RGB={"Floresta":[74,144,255],"Estrela":[51,221,59],"Aurora":[255,61,240],"MOV.Dome":[46,196,182],"Fervo":[255,138,42],"Secreto":[123,224,163],"Magic Drags":[166,124,255],"Casa do Rock":[255,90,78],"Coreto":[243,217,196],"Samba":[231,184,255],"Reggae Yard":[200,242,107],"Speakeasy":[255,224,138],"Brinquedos":[51,221,59],"Skatepark":[143,211,255],"Quadras":[255,176,196],"Kids":[255,208,161]};
    var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}), M=14, W=210, H=297, y=0, INK=[23,18,10];
    var cl=function(t){ return t.replace(/[’]/g,"'").replace(/[–]/g,"-"); };
    function bg(){ doc.setFillColor(255,198,26); doc.rect(0,0,W,H,"F"); y=16; }
    function poly(p,ox,oy,sc,f){ var v=[]; for(var i=1;i<p.length;i++) v.push([(p[i][0]-p[i-1][0])*sc,(p[i][1]-p[i-1][1])*sc]); doc.setFillColor(f[0],f[1],f[2]); doc.lines(v,ox+p[0][0]*sc,oy+p[0][1]*sc,[1,1],"FD",true); }
    function logo(x,yy,sc){
      doc.setLineWidth(0.6); doc.setDrawColor(INK[0],INK[1],INK[2]); doc.setLineJoin("round");
      doc.setFillColor(255,61,240); doc.circle(x+60*sc,yy+18*sc,11*sc,"FD");
      poly([[4,70],[30,22],[50,56],[58,44],[76,70]],x,yy,sc,[74,144,255]);
      poly([[30,22],[38,36],[33,33],[29,38],[25,32]],x,yy,sc,[255,255,255]);
      poly([[36,44],[26,60],[33,58],[28,72],[44,53],[36,54]],x,yy,sc,[51,221,59]);
    }
    bg(); logo(M,y-4,0.34);
    doc.setTextColor(INK[0],INK[1],INK[2]); doc.setFont("helvetica","bold"); doc.setFontSize(28);
    doc.text(["MEU ROCK","THE MOUNTAIN"],M+32,y+8,{lineHeightFactor:1.05}); y+=32;
    DAYS.forEach(function(D,di){
      var list=chosen(di); if(!list.length) return;
      if(y+16>H-14){ doc.addPage(); bg(); }
      doc.setFillColor(255,61,240); doc.setLineWidth(0.6); doc.setDrawColor(INK[0],INK[1],INK[2]);
      doc.roundedRect(M,y,W-2*M,10,2,2,"FD"); doc.setFont("helvetica","bold"); doc.setFontSize(15);
      doc.text(cl(D.l).toUpperCase(),W/2,y+6.9,{align:"center"}); y+=15;
      var reach=null;
      list.forEach(function(x){
        var cx=M+16, cw=W-M-cx-1.5;
        doc.setFont("helvetica","bold"); doc.setFontSize(13);
        var nm=doc.splitTextToSize(cl(x.n),cw-7);
        var warn=reach&&x.s<reach.e;
        var h=5.2+nm.length*5.4+4.6+(warn?4.8:0);
        if(y+h+4>H-14){ doc.addPage(); bg(); }
        doc.setTextColor(INK[0],INK[1],INK[2]); doc.setFontSize(12.5); doc.text(x.a,M,y+6.6);
        doc.setFillColor(INK[0],INK[1],INK[2]); doc.rect(cx+1.2,y+1.2,cw,h,"F");
        var c=RGB[x.st]||[243,217,196]; doc.setFillColor(c[0],c[1],c[2]); doc.setLineWidth(0.6); doc.rect(cx,y,cw,h,"FD");
        doc.setFontSize(13); doc.text(nm,cx+3.5,y+6.6);
        var ly=y+6.6+(nm.length-1)*5.4+5;
        doc.setFontSize(9.5); doc.text(cl(x.st+"  ·  "+rng(x)),cx+3.5,ly);
        if(warn){ doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text(cl("Choque com "+reach.n+" ("+(reach.e-x.s)+" min)"),cx+3.5,ly+4.6); }
        y+=h+4.4;
        if(!reach||x.e>reach.e) reach=x;
      });
      y+=4;
    });
    if(dl){ await dl.save({filename:"meu-roteiro-festival.pdf",data:doc.output("blob")}); } else { doc.save("meu-roteiro-festival.pdf"); }
  }catch(e){ if(!e||e.code!=="declined") msg("Não foi possível gerar o PDF"); }
};
